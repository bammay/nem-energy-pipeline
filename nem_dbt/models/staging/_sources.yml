version: 2

sources:
  - name: raw
    description: Raw AEMO data loaded into PostgreSQL by src/load_postgres.py
    schema: raw
    tables:
      - name: price_demand
        description: AEMO 5-minute regional price and demand, NEM market time (AEST)

  - name: silver
    description: Cleaned AEMO data built in Databricks by databricks/02_bronze_silver
    database: workspace
    schema: silver
    tables:
      - name: price_demand
        description: Typed, de-duplicated and quality-checked price and demand